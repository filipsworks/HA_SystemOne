name: docker

# main → :cpu, :cuda (and :latest = cpu); tag vX.Y.Z → :X.Y.Z-cpu, :X.Y.Z-cuda.
# Pull requests only build the CPU image, without pushing.
# Files that never reach the image (see .dockerignore) don't trigger a rebuild; tag pushes
# ignore path filters, and "Run workflow" (workflow_dispatch) always builds.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: &not-in-image
      - "**.md"
      - "docs/**"
      - "tests/**"
      - "eval/**"
      - "aliases.example.yaml"
      - ".env_example"
      - "compose*.yaml"
      - ".claude/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths-ignore: *not-in-image
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
        exclude:
          - variant: ${{ github.event_name == 'pull_request' && 'cuda' || 'none' }}
    steps:
      # The CUDA image is ~6.5 GB; the runner's default free space is not enough.
      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ha_systemone
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.variant }},enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'cpu' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH=${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max,ignore-error=true
